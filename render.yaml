services:
  - type: web
    name: alpha-quant-platform
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/system/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PROJECT_NAME
        value: "Alpha Quant Platform"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MT5_ACCOUNT_LOGIN
        sync: false
      - key: MT5_ACCOUNT_PASSWORD
        sync: false
      - key: MT5_ACCOUNT_SERVER
        value: "Exness-MT5Trial15"
      - key: ALLOWED_ORIGINS
        value: "https://alpha-quant-platform.onrender.com"
      - key: NEWS_API_KEY
        sync: false
      - key: BROKER_NAME
        value: "Exness MT5"
      # Run the engine in auto-execution mode: real/simulated orders will fire
      # based on broker connectivity.
      - key: AUTO_TRADE_SIGNALS_ONLY
        value: "false"
